# docker compose up -d   →   http://localhost:8787
# Offices, buildings and previews live in the "overtime-data" volume and survive restarts/upgrades.
services:
  overtime:
    build: .
    image: overtime:local
    ports:
      # loopback only by default: put a reverse proxy or tunnel in front (docs/SELF_HOST.md, A3).
      # Docker-published ports bypass host firewalls such as ufw; set OVERTIME_BIND=0.0.0.0 only on a
      # private network you trust.
      - "${OVERTIME_BIND:-127.0.0.1}:8787:8787"
    volumes:
      - overtime-data:/data
    environment:
      # days without events before an office is deleted
      EXT_TTL_DAYS: "30"
      # remote control (optional, see docs/SELF_HOST.md). Put real values in a .env file next to this one.
      PUBLIC_URL: ${PUBLIC_URL:-}
      OVERTIME_SECRET_KEY: ${OVERTIME_SECRET_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      OVERTIME_TELEGRAM_OFFICES: ${OVERTIME_TELEGRAM_OFFICES:-}
    restart: unless-stopped

volumes:
  overtime-data:
