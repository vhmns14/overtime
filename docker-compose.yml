# docker compose up -d   →   http://localhost:8787
# Offices, buildings and previews live in the "overtime-data" volume and survive restarts/upgrades.
services:
  overtime:
    build: .
    image: overtime:local
    ports:
      - "8787:8787"
    volumes:
      - overtime-data:/data
    environment:
      # days without events before an office is deleted
      EXT_TTL_DAYS: "30"
      # remote control (optional, see docs/SELF_HOST.md). Put real values in a .env file next to this one.
      PUBLIC_URL: ${PUBLIC_URL:-}
      OVERTIME_SECRET_KEY: ${OVERTIME_SECRET_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      OVERTIME_TELEGRAM_OFFICES: ${OVERTIME_TELEGRAM_OFFICES:-}
    restart: unless-stopped

volumes:
  overtime-data:
