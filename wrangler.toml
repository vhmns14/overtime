# Overtime: one Worker serves the app (Workers Static Assets), the BYO-key LLM proxy,
# the Research page fetcher, and run previews at /p/<runId>/ (SQLite Durable Object per run).
name = "overtime"
main = "worker/src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/p/*"]

[[durable_objects.bindings]]
name = "PREVIEWS"
class_name = "PreviewStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PreviewStore"]

[vars]
PREVIEW_TTL_DAYS = "7"
# "1" only for local development: lets the proxy reach a local Ollama at http://localhost:11434
ALLOW_LOCAL_LLM = "0"
# For local Ollama put ALLOW_LOCAL_LLM=1 in .dev.vars (never committed).
