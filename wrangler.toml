# Overtime: one Worker serves the app (Workers Static Assets), the BYO-key LLM proxy,
# the Research page fetcher, run previews at /p/<runId>/ (SQLite Durable Object per run), and
# external-agent offices for Hermes at /api/ext/* (SQLite Durable Object per office; remote control
# lives in the same class, so it needs no migration), and buildings that group offices as floors.
name = "overtime"
main = "worker/src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/p/*"]

[[durable_objects.bindings]]
name = "PREVIEWS"
class_name = "PreviewStore"

[[durable_objects.bindings]]
name = "EXT_OFFICES"
class_name = "ExtOffice"

[[durable_objects.bindings]]
name = "EXT_BUILDINGS"
class_name = "ExtBuilding"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PreviewStore"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ExtOffice"]

# buildings: several Hermes installs (offices) as floors of one building
[[migrations]]
tag = "office-buildings-v1"
new_sqlite_classes = ["ExtBuilding"]

[vars]
PREVIEW_TTL_DAYS = "7"
# external-agent offices (Hermes) are deleted after this many days without events
EXT_TTL_DAYS = "30"
# "1" only for local development: lets the proxy reach a local Ollama at http://localhost:11434
ALLOW_LOCAL_LLM = "0"
# For local Ollama put ALLOW_LOCAL_LLM=1 in .dev.vars (never committed).
